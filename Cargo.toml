[package]
name = "vault-auto-unseal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
signal-hook = "0.4.4"
ureq = { version = "3.3.0", features = ["json"] }

[[bin]]
name = "vault-auto-unseal"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0.154"
testcontainers = { version = "0.28.0", features = ["blocking"] }
