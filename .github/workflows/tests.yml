name: Tests
on:
  pull_request:

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: "test_cache"

      - uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # nextest
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test
        run: cargo llvm-cov nextest --no-fail-fast --no-report

      - name: Coverage Summary
        if: always()
        run: cargo llvm-cov report --summary-only >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Result File
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/target/nextest/default/junit.xml
          retention-days: 5

  # Test results are published by tests-publish.yml, which also works for PRs from forks
  event_file:
    name: Upload Event File
    runs-on: ubuntu-latest
    steps:
      - name: Upload Event File
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: event-file
          path: ${{ github.event_path }}
          retention-days: 5
